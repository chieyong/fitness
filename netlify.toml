# Netlify-configuratie. De Supabase-sleutels staan hier bewust niet in: Vite
# bakt ze tijdens de build in de bundel, dus ze horen als build-variabelen in
# de site-instellingen (Site configuration -> Environment variables).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Service worker en manifest altijd vers ophalen; anders blijft een oude versie hangen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
