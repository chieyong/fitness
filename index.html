<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDF0F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#242832" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Repz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <title>Repz</title>
    <script>
      // Eigen themakeuze vóór de eerste weergave toepassen, anders flitst het andere thema.
      try {
        var t = localStorage.getItem('repz.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script>window.__splashStart = performance.now();</script>
    <style>
      /* Laadscherm: staat hier inline, zodat het verschijnt vóór de app geladen is. */
      .splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #EDF0F6;
        transition: opacity 380ms ease, transform 380ms ease;
      }
      :root[data-theme="dark"] .splash { background: #242832; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .splash { background: #242832; } }

      .splash__mark {
        width: 96px; height: 96px;
        filter: drop-shadow(0 14px 24px rgba(45, 98, 230, 0.45));
        animation: splash-pop 620ms cubic-bezier(0.2, 1.3, 0.3, 1) both;
      }
      .splash__mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .splash__lift { animation: splash-lift 900ms ease-in-out 560ms infinite; }

      .splash__word {
        display: flex;
        font: 700 34px/1 'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.02em; color: #1B2130;
      }
      :root[data-theme="dark"] .splash__word { color: #FFFFFF; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .splash__word { color: #FFFFFF; } }
      .splash__word span { display: inline-block; opacity: 0; transform: translateY(10px); animation: splash-letter 420ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .splash__word span:nth-child(1) { animation-delay: 260ms; }
      .splash__word span:nth-child(2) { animation-delay: 320ms; }
      .splash__word span:nth-child(3) { animation-delay: 380ms; }
      .splash__word span:nth-child(4) { animation-delay: 440ms; }

      .splash__bar { width: 120px; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(61, 82, 212, 0.16); opacity: 0; animation: splash-fade 300ms ease 700ms forwards; }
      .splash__bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #2471D6, #3D52D4); animation: splash-slide 1100ms ease-in-out infinite; }

      .splash--done { opacity: 0; transform: scale(1.04); pointer-events: none; }

      @keyframes splash-pop { from { opacity: 0; transform: scale(0.55) rotate(-24deg); } to { opacity: 1; transform: scale(1) rotate(-6deg); } }
      @keyframes splash-lift { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-26px); } }
      @keyframes splash-letter { to { opacity: 1; transform: none; } }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

      @media (prefers-reduced-motion: reduce) {
        .splash, .splash * { animation: none !important; transition: none !important; }
        .splash__word span, .splash__bar { opacity: 1; transform: none; }
        .splash__mark { transform: rotate(-6deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash__mark">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="splash-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2471D6" />
              <stop offset="1" stop-color="#3D52D4" />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#splash-g)" />
          <g class="splash__lift">
            <g transform="rotate(-18 256 256)" fill="#FFFFFF">
              <rect x="150" y="238" width="212" height="36" rx="18" />
              <rect x="104" y="170" width="58" height="172" rx="24" />
              <rect x="350" y="170" width="58" height="172" rx="24" />
              <rect x="66" y="208" width="40" height="96" rx="18" />
              <rect x="406" y="208" width="40" height="96" rx="18" />
            </g>
          </g>
        </svg>
      </div>
      <div class="splash__word"><span>R</span><span>e</span><span>p</span><span>z</span></div>
      <div class="splash__bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
